name: monitor-enel

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Escribir diagnostico
        run: |
          cat > diag.py << 'PYEOF'
          import re, sys, time, json
          from playwright.sync_api import sync_playwright

          URL = "https://servicequendalat.enel.com/citaprevia/?pais=cl"
          OFICINA = r"PROVIDENCIA"
          PATRON = r"empalme"

          red = []

          def elegir_texto(page, patron, espera=30):
              fin = time.time() + espera
              while time.time() < fin:
                  for s in page.query_selector_all("select"):
                      for op in s.query_selector_all("option"):
                          txt = (op.inner_text() or "").strip()
                          val = op.get_attribute("value")
                          if val and re.search(patron, txt, re.I):
                              s.select_option(val); return val, txt
                  page.wait_for_timeout(1000)
              return None

          def continuar(page):
              for t in ["Continuar", "Siguiente", "Aceptar"]:
                  b = page.query_selector("text=%s" % t)
                  if b and b.is_visible():
                      b.click(); return True
              return False

          JS_CELDAS = """() => {
            const out = [];
            document.querySelectorAll('.ui-datepicker-calendar td').forEach(td => {
              const t = (td.innerText || '').trim();
              if (!/^\\d{1,2}$/.test(t)) return;
              out.push({
                dia: t,
                cls: td.className.trim(),
                hijo: td.firstElementChild ? td.firstElementChild.tagName : null,
                link: !!td.querySelector('a')
              });
            });
            return out;
          }"""

          JS_MES = """() => {
            const m = document.querySelector('.ui-datepicker-month');
            const y = document.querySelector('.ui-datepicker-year');
            return (m ? m.innerText : '?') + ' ' + (y ? y.innerText : '?');
          }"""

          JS_DERECHA = """() => {
            const d = document.querySelector('#columnaDerecha') ||
                      document.querySelector('.column:not(.calendario)');
            return d ? d.innerHTML.slice(0, 2500) : 'sin columna derecha';
          }"""

          with sync_playwright() as p:
              nav = p.chromium.launch()
              page = nav.new_page(viewport={"width": 1280, "height": 1400})
              page.on("request", lambda r: red.append((r.method, r.url, (r.post_data or "")[:300]))
                      if r.resource_type in ("xhr", "fetch", "document") else None)
              try:
                  page.goto(URL, wait_until="networkidle")
                  page.wait_for_timeout(5000)
                  elegir_texto(page, OFICINA)
                  page.wait_for_timeout(4000)

                  lista = []
                  fin = time.time() + 20
                  while time.time() < fin and not lista:
                      for s in page.query_selector_all("select"):
                          for op in s.query_selector_all("option"):
                              v = op.get_attribute("value")
                              t = (op.inner_text() or "").strip()
                              if v and re.search(PATRON, t, re.I):
                                  lista.append((v, t))
                      if not lista:
                          page.wait_for_timeout(1000)
                  print("=== TRAMITES:", json.dumps(lista, ensure_ascii=False))

                  for valor, etiqueta in lista:
                      page.goto(URL, wait_until="networkidle")
                      page.wait_for_timeout(5000)
                      elegir_texto(page, OFICINA)
                      page.wait_for_timeout(4000)
                      ok = False
                      for s in page.query_selector_all("select"):
                          for op in s.query_selector_all("option"):
                              if op.get_attribute("value") == valor:
                                  s.select_option(valor); ok = True
                      if not ok:
                          print("!! no pude seleccionar", etiqueta); continue
                      page.wait_for_timeout(2000)
                      continuar(page)
                      page.wait_for_timeout(6000)

                      for _ in range(4):
                          mes = page.evaluate(JS_MES)
                          celdas = page.evaluate(JS_CELDAS)
                          clases = {}
                          libres = []
                          for c in celdas:
                              k = c["cls"]
                              clases[k] = clases.get(k, 0) + 1
                              if "unselectable" not in k and "ui-state-disabled" not in k:
                                  libres.append(c)
                          print("--- %s | %s | %d celdas" % (etiqueta[:40], mes, len(celdas)))
                          for k, n in clases.items():
                              print("     x%-2d  %s" % (n, k))
                          if libres:
                              print("     LIBRES:", libres)
                              d = libres[0]["dia"]
                              try:
                                  page.click(".ui-datepicker-calendar td:not(.ui-state-disabled) a")
                                  page.wait_for_timeout(5000)
                                  print("     TRAS CLICK dia %s:" % d)
                                  print("     TEXTO:", (page.inner_text("body") or "")[:1200].replace("\n", " | "))
                                  print("     DERECHA:", page.evaluate(JS_DERECHA))
                              except Exception as e:
                                  print("     fallo click:", e)
                          nxt = page.query_selector("a.ui-datepicker-next")
                          if not nxt or not nxt.is_visible():
                              break
                          nxt.click(); page.wait_for_timeout(2500)
              finally:
                  nav.close()

          print("=== RED (xhr/fetch/document) ===")
          vistos = set()
          for m, u, d in red:
              k = (m, u.split("?")[0])
              if k in vistos and not d: continue
              vistos.add(k)
              print(m, u[:220], "| POST:", d)
          PYEOF

      - name: Ejecutar diagnostico
        run: python diag.py
