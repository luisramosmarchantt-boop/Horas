name: monitor-enel

on:
  schedule:
    # GitHub estrangula los schedules del repo privado: se pide cada 15 min y
    # en la practica arranca cada ~3,5 horas (medido en septiembre de 2026).
    # Por eso cada corrida se queda sondeando un rato; ver monitor.py.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-enel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperar estado previo
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-enel-${{ github.run_id }}
          restore-keys: |
            estado-enel-

      - name: Revisar disponibilidad
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OFICINAS: PROVIDENCIA|LA FLORIDA
          PATRON: empalme
          MESES: '4'
          PAUSA: '45'
          # para saber si el repo es publico (minutos gratis: vigilancia
          # continua) o privado (se reparte el presupuesto del mes)
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -u monitor.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: estado-enel-${{ github.run_id }}

