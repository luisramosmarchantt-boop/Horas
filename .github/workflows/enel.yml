name: monitor-enel

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Escribir monitor
        run: |
          cat > monitor.py << 'PYEOF'
          import os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime
          from playwright.sync_api import sync_playwright

          URL = "https://servicequendalat.enel.com/citaprevia/?pais=cl"
          OFICINA = r"PROVIDENCIA"
          PATRON = r"empalme"
          MESES = 3
          TG_TOKEN = os.environ.get("TG_TOKEN", "")
          TG_CHAT_ID = os.environ.get("TG_CHAT_ID", "")

          def avisar(t):
              print(t)
              if not (TG_TOKEN and TG_CHAT_ID):
                  return
              d = urllib.parse.urlencode({"chat_id": TG_CHAT_ID, "text": t}).encode()
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      "https://api.telegram.org/bot%s/sendMessage" % TG_TOKEN,
                      data=d), timeout=20).read()
              except Exception as e:
                  print("fallo telegram:", e, file=sys.stderr)

          def volcar(page, titulo):
              print("=== %s ===" % titulo)
              for i, s in enumerate(page.query_selector_all("select")):
                  ops = s.query_selector_all("option")
                  print("select[%d] id=%s opciones=%d"
                        % (i, s.get_attribute("id"), len(ops)))
                  for op in ops:
                      print("    value=%r texto=%r"
                            % (op.get_attribute("value"), (op.inner_text() or "").strip()))

          def elegir_texto(page, patron, espera=30):
              fin = time.time() + espera
              while time.time() < fin:
                  for s in page.query_selector_all("select"):
                      for op in s.query_selector_all("option"):
                          txt = (op.inner_text() or "").strip()
                          val = op.get_attribute("value")
                          if val and re.search(patron, txt, re.I):
                              s.select_option(val)
                              return val, txt
                  page.wait_for_timeout(1000)
              return None

          def elegir_valor(page, valor):
              for s in page.query_selector_all("select"):
                  for op in s.query_selector_all("option"):
                      if op.get_attribute("value") == valor:
                          s.select_option(valor)
                          return True
              return False

          def rgb(v):
              m = re.findall(r"[\d.]+", v or "")
              return tuple(int(float(x)) for x in m[:3]) if len(m) >= 3 else None

          def verde(c):
              if not c:
                  return False
              r, g, b = c
              return g > r + 25 and g > b + 25

          JS_CELDAS = """() => {
            const out = [];
            document.querySelectorAll('td, div').forEach(el => {
              const t = (el.innerText || '').trim();
              if (!/^\\d{1,2}$/.test(t)) return;
              if (el.children.length > 1) return;
              const cs = getComputedStyle(el);
              out.push({dia: t, bg: cs.backgroundColor,
                        bgp: getComputedStyle(el.parentElement || el).backgroundColor});
            });
            return out;
          }"""

          JS_MES = """() => {
            const el = [...document.querySelectorAll('*')].find(e =>
              /^(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre)\\s+\\d{4}$/i
              .test((e.innerText||'').trim()) && e.children.length === 0);
            return el ? el.innerText.trim() : 'mes?';
          }"""

          def avanzar(page):
              for s in ["a.ui-datepicker-next", ".ui-datepicker-next",
                        "[title*='Sig' i]", "[class*='next' i]", "[id*='next' i]"]:
                  el = page.query_selector(s)
                  if el and el.is_visible():
                      el.click(); page.wait_for_timeout(2000); return True
              return False

          def continuar(page):
              for t in ["Continuar", "Siguiente", "Aceptar"]:
                  b = page.query_selector("text=%s" % t)
                  if b and b.is_visible():
                      b.click(); return True
              return False

          with sync_playwright() as p:
              nav = p.chromium.launch()
              page = nav.new_page(viewport={"width": 1280, "height": 1400})
              hall = []
              try:
                  page.goto(URL, wait_until="networkidle")
                  page.wait_for_timeout(5000)

                  if not elegir_texto(page, OFICINA):
                      volcar(page, "NO SE ENCONTRO LA OFICINA")
                      sys.exit(1)
                  page.wait_for_timeout(4000)

                  lista = []
                  fin = time.time() + 20
                  while time.time() < fin and not lista:
                      for s in page.query_selector_all("select"):
                          for op in s.query_selector_all("option"):
                              v = op.get_attribute("value")
                              t = (op.inner_text() or "").strip()
                              if v and re.search(PATRON, t, re.I):
                                  lista.append((v, t))
                      if not lista:
                          page.wait_for_timeout(1000)

                  if not lista:
                      volcar(page, "NO HAY TRAMITES CON 'EMPALME'")
                      sys.exit(1)

                  print("tramites detectados:", lista)

                  for valor, etiqueta in lista:
                      page.goto(URL, wait_until="networkidle")
                      page.wait_for_timeout(5000)
                      elegir_texto(page, OFICINA)
                      page.wait_for_timeout(4000)
                      if not elegir_valor(page, valor):
                          print("no pude seleccionar", etiqueta); continue
                      page.wait_for_timeout(2000)
                      continuar(page)
                      page.wait_for_timeout(5000)

                      for _ in range(MESES):
                          mes = page.evaluate(JS_MES)
                          celdas = page.evaluate(JS_CELDAS)
                          print("%s | %s | %d celdas" % (etiqueta, mes, len(celdas)))
                          for c in celdas:
                              if verde(rgb(c["bg"]) or rgb(c["bgp"])):
                                  hall.append("%s | %s %s" % (etiqueta, c["dia"], mes))
                          if not avanzar(page):
                              break
              finally:
                  nav.close()

          ts = datetime.now().strftime("%d-%m-%Y %H:%M UTC")
          if hall:
              avisar("CUPOS ENEL PROVIDENCIA (%s)\n%s\n\n%s"
                     % (ts, "\n".join(hall[:25]), URL))
          else:
              print(ts, "- sin cupos")
          PYEOF

      - name: Revisar disponibilidad
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py
