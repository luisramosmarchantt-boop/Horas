name: monitor-enel

on:
  schedule:
    # GitHub estrangula los schedules: en la practica esto corre ~1 vez por hora.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-enel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperar estado previo
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-enel-${{ github.run_id }}
          restore-keys: |
            estado-enel-

      - name: Revisar disponibilidad
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OFICINAS: PROVIDENCIA|LA FLORIDA
          PATRON: empalme
          MESES: '4'
          # cada corrida se queda sondeando este rato en horario habil chileno,
          # porque GitHub estrangula los schedules y no controlamos el arranque
          SONDEO_UTIL: '15'
          PAUSA: '90'
        run: python monitor.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: estado-enel-${{ github.run_id }}

