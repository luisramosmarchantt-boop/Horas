name: monitor-enel

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Escribir diagnostico
        run: |
          cat > diag.py << 'PYEOF'
          import re, sys, time
          from playwright.sync_api import sync_playwright

          URL = "https://servicequendalat.enel.com/citaprevia/?pais=cl"
          OFICINA = r"PROVIDENCIA"
          PATRON = r"empalme"

          def elegir_texto(page, patron, espera=30):
              fin = time.time() + espera
              while time.time() < fin:
                  for s in page.query_selector_all("select"):
                      for op in s.query_selector_all("option"):
                          txt = (op.inner_text() or "").strip()
                          val = op.get_attribute("value")
                          if val and re.search(patron, txt, re.I):
                              s.select_option(val); return val, txt
                  page.wait_for_timeout(1000)
              return None

          def continuar(page):
              for t in ["Continuar", "Siguiente", "Aceptar"]:
                  b = page.query_selector("text=%s" % t)
                  if b and b.is_visible():
                      b.click(); return True
              return False

          JS_DUMP = """() => {
            const out = [];
            document.querySelectorAll('td, div, span, a, button, li').forEach(el => {
              const t = (el.innerText || '').trim();
              if (!/^\\d{1,2}$/.test(t)) return;
              if (el.querySelectorAll('*').length > 2) return;
              const cs = getComputedStyle(el);
              const attrs = {};
              for (const a of el.attributes) attrs[a.name] = a.value;
              out.push({
                dia: t,
                tag: el.tagName,
                attrs: attrs,
                cls: el.className && el.className.toString(),
                padreTag: el.parentElement ? el.parentElement.tagName : null,
                padreCls: el.parentElement ? (el.parentElement.className||'').toString() : null,
                padreAttrs: el.parentElement ? [...el.parentElement.attributes].map(a=>a.name+'='+a.value).join(' ') : null,
                bg: cs.backgroundColor,
                color: cs.color,
                cursor: cs.cursor,
                opacity: cs.opacity,
                pe: cs.pointerEvents,
                hijos: el.innerHTML.slice(0, 200),
                disabled: el.disabled === true || el.getAttribute('aria-disabled')
              });
            });
            return out;
          }"""

          JS_CONTENEDOR = """() => {
            // el ancestro comun mas cercano que contenga al menos 20 numeros de dia
            const nums = [...document.querySelectorAll('*')].filter(e => {
              const t = (e.innerText||'').trim();
              return /^\\d{1,2}$/.test(t) && e.querySelectorAll('*').length <= 2;
            });
            if (!nums.length) return 'sin celdas';
            let p = nums[0];
            for (let i = 0; i < 6 && p.parentElement; i++) p = p.parentElement;
            return p.outerHTML.slice(0, 6000);
          }"""

          with sync_playwright() as p:
              nav = p.chromium.launch()
              page = nav.new_page(viewport={"width": 1280, "height": 1400})
              try:
                  page.goto(URL, wait_until="networkidle")
                  page.wait_for_timeout(5000)
                  print("=== TITULO:", page.title())
                  if not elegir_texto(page, OFICINA):
                      print("no se encontro la oficina"); print(page.content()[:4000]); sys.exit(1)
                  page.wait_for_timeout(4000)

                  lista = []
                  fin = time.time() + 20
                  while time.time() < fin and not lista:
                      for s in page.query_selector_all("select"):
                          for op in s.query_selector_all("option"):
                              v = op.get_attribute("value")
                              t = (op.inner_text() or "").strip()
                              if v and re.search(PATRON, t, re.I):
                                  lista.append((v, t))
                      if not lista:
                          page.wait_for_timeout(1000)
                  print("=== TRAMITES:", [t for _, t in lista])
                  if not lista: sys.exit(1)

                  valor, etiqueta = lista[0]
                  for s in page.query_selector_all("select"):
                      for op in s.query_selector_all("option"):
                          if op.get_attribute("value") == valor:
                              s.select_option(valor)
                  page.wait_for_timeout(2000)
                  continuar(page)
                  page.wait_for_timeout(6000)

                  print("=== TRAMITE ELEGIDO:", etiqueta)
                  print("=== TEXTO PAGINA ===")
                  print((page.inner_text("body") or "")[:3000])
                  print("=== CONTENEDOR CALENDARIO ===")
                  print(page.evaluate(JS_CONTENEDOR))
                  print("=== CELDAS ===")
                  for c in page.evaluate(JS_DUMP):
                      print(c)
                  print("=== BOTONES/LINKS VISIBLES ===")
                  for el in page.query_selector_all("a, button"):
                      try:
                          if el.is_visible():
                              print(repr((el.inner_text() or "").strip()[:60]),
                                    el.get_attribute("class"), el.get_attribute("title"))
                      except Exception:
                          pass
              finally:
                  page.screenshot(path="cal.png", full_page=True)
                  nav.close()
          PYEOF

      - name: Ejecutar diagnostico
        run: python diag.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura
          path: cal.png
